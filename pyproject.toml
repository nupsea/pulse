[project]
name = "pulse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "gtfs-realtime-bindings>=3.0.0",
    "mcp>=2.3.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "marimo[sql]>=0.25.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

